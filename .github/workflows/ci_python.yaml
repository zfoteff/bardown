---
name: Python Project CI
on:
  workflow_call:
    inputs:
      WORKING_DIR:
        description: "Working directory for the service being built and tested"
        required: true
        type: string
        default: "."
      INSTALL_PACKAGES:
        description: "Space-separated list of packages to install using apt-get."
        default: ""
        type: string
      APPLICATION_NAME:
        description: "Name of the image to be published"
        type: string
        required: true
    outputs:
      BUILD_VERSION:
        description: "Full build version tag"
        value: ${{ jobs.build.ouputs.version }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version}}
    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        timeout-minutes: 5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ inputs.WORKING_DIR }}/requirements.txt

      - name: Install extra packages
        if: ${{ inputs.INSTALL_PACKAGES != ''}}
        run: |
          sudo apt-get install -y ${{ inputs.INSTALL_PACKAGES }}

      - name: Pip install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Version Tag
        id: version
        run: |
          python -v ${{ inputs.WORKING_DIR }}/${{ inputs.APPLICATION_NAME }}.py
          VERSION=$(python3 -v ${{inputs.WORKING_DIR}}/${{ inputs.APPLICATION_NAME }}.py)
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          VERSION_TAG="${VERSION}-${SHORT_SHA}"
          echo ${VERSION_TAG}
          echo "version=$VERSION_TAG" >> GITHUB_OUTPUT

      - name: Test Python service
        run: |
          python3 -m pytest tests/

  publish:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    needs:
      - build
    steps:
      - uses: actions/checkout@v4

      - name: Log into Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Metadata for Docker
        id: metadata
        uses: docker/metadata-action@v3
        with:
          images: bardown/${{inputs.APPLICATION_NAME}}:${{ needs.build.outputs.version }}

      - name: Push Docker Image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.WORKING_DIR }}/dockerfile
          push: true
          tags: bardown/${{inputs.APPLICATION_NAME}}:${{ needs.build.outputs.version }}
